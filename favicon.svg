<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30">
  <!-- white square with the greek flag (27 x 18, nine stripes) centered on it -->
  <rect width="30" height="30" fill="#ffffff"/>
  <g transform="translate(1.5 6)">
    <rect width="27" height="18" fill="#ffffff"/>
    <g fill="#0d5eaf">
      <rect y="0" width="27" height="2"/>
      <rect y="4" width="27" height="2"/>
      <rect y="8" width="27" height="2"/>
      <rect y="12" width="27" height="2"/>
      <rect y="16" width="27" height="2"/>
      <rect width="10" height="10"/>
    </g>
    <g fill="#ffffff">
      <rect y="4" width="10" height="2"/>
      <rect x="4" width="2" height="10"/>
    </g>
  </g>
</svg>
